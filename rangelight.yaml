apiVersion: "rangelight.dev/v1alpha1"
kind: "PreviewProfile"
metadata:
  name: "otel-demo"
spec:
  services:
    - name: "frontend-proxy"
      serviceName: "frontend-proxy"
      port: 8080
      expose: true
